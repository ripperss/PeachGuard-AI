[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "peachguard-ai"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.9.0",
    "pillow>=11.0.0",
    "python-telegram-bot>=21.10",
    "pyyaml>=6.0.3",
    "torch>=2.12.0",
    "ultralytics>=8.4.51",
]

[project.scripts]
peachguard-report = "peachguard.cli.report:main"
peachguard-bot = "peachguard.cli.bot:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["peachguard*"]
